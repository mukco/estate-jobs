name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: baseball, POSTGRES_PASSWORD: baseball }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGUSER: baseball
      PGPASSWORD: baseball
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3.6", bundler-cache: true }
      - run: bundle exec rspec spec
